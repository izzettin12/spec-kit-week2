<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <title>Daily Lines — Quote of the Day</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #192a24;
        background: #f4f1ea;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --green: #245c46;
        --green-dark: #173d2f;
        --muted: #5b6860;
        --paper: #fffefa;
        --line: #deddd3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      button {
        font: inherit;
      }

      button:focus-visible {
        outline: 3px solid #c36d35;
        outline-offset: 3px;
      }

      .shell {
        width: min(100% - 2rem, 850px);
        margin: 0 auto;
        padding: 3.5rem 0;
      }

      header {
        margin-bottom: 2rem;
      }

      .eyebrow {
        margin: 0 0 0.55rem;
        color: var(--green);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 8vw, 3.5rem);
        font-weight: 500;
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 0.65rem 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .quote-card {
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: var(--paper);
        box-shadow: 0 18px 50px rgb(35 49 41 / 7%);
      }

      .quote-mark {
        margin: 0;
        color: #b5c8b9;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 4rem;
        line-height: 0.8;
      }

      blockquote {
        margin: 1.25rem 0 1rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.55rem, 4.5vw, 2.45rem);
        line-height: 1.38;
        overflow-wrap: anywhere;
      }

      .attribution {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .button {
        min-height: 2.8rem;
        padding: 0.7rem 1rem;
        border: 1px solid var(--green);
        border-radius: 0.55rem;
        color: var(--green-dark);
        background: transparent;
        cursor: pointer;
        font-weight: 650;
        transition: background-color 120ms ease, color 120ms ease;
      }

      .button:hover {
        background: #e8f0e9;
      }

      .button-primary {
        color: #fff;
        background: var(--green);
      }

      .button-primary:hover {
        color: #fff;
        background: var(--green-dark);
      }

      .button[aria-pressed="true"] {
        color: #fff;
        background: var(--green-dark);
      }

      .status {
        min-height: 1.5rem;
        margin: 0.9rem 0 0;
        color: #8a3d23;
        font-size: 0.92rem;
      }

      .favorites {
        margin-top: 2.5rem;
      }

      .favorites h2 {
        margin: 0 0 0.9rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.55rem;
        font-weight: 500;
      }

      .favorite-list {
        display: grid;
        gap: 0.6rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .favorite-item {
        width: 100%;
        padding: 0.9rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        color: inherit;
        background: var(--paper);
        cursor: pointer;
        text-align: left;
      }

      .favorite-item:hover {
        border-color: #9cb6a2;
        background: #fbfcf7;
      }

      .favorite-item[aria-current="true"] {
        border-color: var(--green);
        box-shadow: inset 3px 0 var(--green);
      }

      .favorite-quote {
        display: block;
        line-height: 1.45;
      }

      .favorite-attribution {
        display: block;
        margin-top: 0.3rem;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .empty-state {
        margin: 0;
        padding: 1rem;
        border: 1px dashed #b8b9ae;
        border-radius: 0.6rem;
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 520px) {
        .shell {
          padding: 2.25rem 0;
        }

        .actions {
          display: grid;
        }

        .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">A moment to reflect</p>
        <h1>Daily Lines</h1>
        <p class="intro">A little thought for wherever you are today.</p>
      </header>

      <section class="quote-card" aria-labelledby="quote-heading">
        <h2 class="eyebrow" id="quote-heading">Quote of the day</h2>
        <p class="quote-mark" aria-hidden="true">“</p>
        <blockquote id="quote-text" aria-live="polite"></blockquote>
        <p class="attribution" id="quote-attribution"></p>
        <div class="actions">
          <button class="button button-primary" id="new-quote" type="button">
            New quote
          </button>
          <button
            class="button"
            id="favorite-toggle"
            type="button"
            aria-pressed="false"
          >
            Add to favorites
          </button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="favorites" aria-labelledby="favorites-heading">
        <h2 id="favorites-heading">Your favorites</h2>
        <ul class="favorite-list" id="favorite-list"></ul>
      </section>
    </main>

    <script>
      "use strict";

      const quotes = [
        {
          id: "small-steps",
          text: "Small steps still move you toward somewhere new.",
          attribution: "A note for today"
        },
        {
          id: "make-room",
          text: "Make room for the good ideas that arrive quietly.",
          attribution: "A note for today"
        },
        {
          id: "begin-again",
          text: "You can begin again without starting from nothing.",
          attribution: "A note for today"
        },
        {
          id: "steady-light",
          text: "A steady light is made of many ordinary moments.",
          attribution: "A note for today"
        },
        {
          id: "curiosity",
          text: "Let curiosity take you one question further.",
          attribution: "A note for today"
        },
        {
          id: "gentle-progress",
          text: "Progress can be gentle and still be real.",
          attribution: "A note for today"
        }
      ];

      const storageKey = "quote-of-the-day:favorites:v1";
      const quoteText = document.querySelector("#quote-text");
      const attribution = document.querySelector("#quote-attribution");
      const favoriteToggle = document.querySelector("#favorite-toggle");
      const favoriteList = document.querySelector("#favorite-list");
      const status = document.querySelector("#status");
      let activeQuote = quotes[Math.floor(Math.random() * quotes.length)];
      let favoriteIds = new Set();

      function quoteById(id) {
        return quotes.find((quote) => quote.id === id);
      }

      function loadFavorites() {
        try {
          const stored = localStorage.getItem(storageKey);
          if (stored === null) {
            return;
          }

          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed) || parsed.some((id) => typeof id !== "string")) {
            throw new Error("Saved favorites have an unexpected format.");
          }

          favoriteIds = new Set(parsed.filter((id) => quoteById(id)));
        } catch (error) {
          status.textContent =
            "Favorites could not be loaded. Your saved list may be unavailable in this browser.";
          console.error("Unable to load saved favorites.", error);
        }
      }

      function renderQuote() {
        quoteText.textContent = activeQuote.text;
        attribution.textContent = `— ${activeQuote.attribution}`;
        const isFavorite = favoriteIds.has(activeQuote.id);
        favoriteToggle.setAttribute("aria-pressed", String(isFavorite));
        favoriteToggle.textContent = isFavorite
          ? "Remove from favorites"
          : "Add to favorites";
      }

      function renderFavorites() {
        favoriteList.replaceChildren();
        const savedQuotes = quotes.filter((quote) => favoriteIds.has(quote.id));

        if (savedQuotes.length === 0) {
          const emptyItem = document.createElement("li");
          emptyItem.className = "empty-state";
          emptyItem.textContent = "Your saved quotes will appear here.";
          favoriteList.append(emptyItem);
          return;
        }

        for (const quote of savedQuotes) {
          const item = document.createElement("li");
          const button = document.createElement("button");
          const text = document.createElement("span");
          const author = document.createElement("span");

          button.className = "favorite-item";
          button.type = "button";
          button.setAttribute("aria-current", String(activeQuote.id === quote.id));
          text.className = "favorite-quote";
          text.textContent = quote.text;
          author.className = "favorite-attribution";
          author.textContent = `— ${quote.attribution}`;
          button.append(text, author);
          button.addEventListener("click", () => {
            activeQuote = quote;
            status.textContent = "";
            render();
          });
          item.append(button);
          favoriteList.append(item);
        }
      }

      function render() {
        renderQuote();
        renderFavorites();
      }

      function saveFavoriteChange(nextFavoriteIds) {
        try {
          localStorage.setItem(storageKey, JSON.stringify([...nextFavoriteIds]));
        } catch (error) {
          status.textContent =
            "Favorites could not be saved. Check your browser storage settings and try again.";
          console.error("Unable to save favorites.", error);
          return false;
        }

        favoriteIds = nextFavoriteIds;
        status.textContent = "";
        render();
        return true;
      }

      document.querySelector("#new-quote").addEventListener("click", () => {
        const alternatives = quotes.filter((quote) => quote.id !== activeQuote.id);
        activeQuote = alternatives[Math.floor(Math.random() * alternatives.length)];
        status.textContent = "";
        render();
      });

      favoriteToggle.addEventListener("click", () => {
        const nextFavoriteIds = new Set(favoriteIds);
        if (nextFavoriteIds.has(activeQuote.id)) {
          nextFavoriteIds.delete(activeQuote.id);
        } else {
          nextFavoriteIds.add(activeQuote.id);
        }
        saveFavoriteChange(nextFavoriteIds);
      });

      loadFavorites();
      render();
    </script>
  </body>
</html>
